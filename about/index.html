    background: var(--bg-alt);

      philosophyHead: 'తత్వం',
      philosophyBody: 'పురాతన సమాజాలు జ్ఞాపకం మరియు తిరిగి చెప్పడం ద్వారా జ్ఞానాన్ని సజీవంగా ఉంచేవి. సాఫ్ట్‌వేర్ ఇప్పుడు అదే పనిని మోస్తుంది: నిర్మించినది గుర్తుంచుకోవాలి, తద్వారా ప్రజలు మళ్లీ మొదటి నుండి ప్రారంభించాల్సిన అవసరం లేకుండా.'
    },
    ta: {

      markHead: 'சின்னம்',
      markBody: 'காஸ்ட்ரோ — செறிவான வளையங்களில் வரையப்பட்ட ஒரு கோட்டை, அதன் சுவர்களுக்குள் குடிசைகள் ஒன்றுகூடியிருக்கும் — *brigā*வை காணக்கூடியதாக ஆக்குகிறது: உயரமான இடத்தில் கட்டப்பட்ட ஒரு குடியேற்றம், நீடிக்கும் அளவுக்கு வலிமையானது மற்றும் முக்கியமானவற்றை தனக்குள் சேகரிக்கும் அளவுக்கு திறந்தது.',

    pa: {

  var currentLang;

  function t(key, vars) {
    var dict = STRINGS[currentLang] || STRINGS.gl;
    var common = BrerenCommon.COMMON_STRINGS[currentLang] || BrerenCommon.COMMON_STRINGS.gl;
    var str = dict[key] || common[key] || STRINGS.gl[key] || BrerenCommon.COMMON_STRINGS.gl[key] || key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        str = str.replace('{' + k + '}', vars[k]);
      });
    }
    return str;
  }

  function selectLang(code) {
    currentLang = code;
    localStorage.setItem('breren-lang', code);
    document.documentElement.lang = code;
    BrerenCommon.applyDirection(code);
    applyTexts();
  }

  function applyTexts() {
    document.title = t('aboutTitle');
    document.getElementById('page-tagline').textContent = t('tagline');
    document.getElementById('home-link').textContent = t('backToHome');
    document.getElementById('home-link-2').textContent = t('backToHome');
    document.getElementById('name-head').textContent = t('nameHead');
    document.getElementById('name-body').textContent = t('aboutOrigin');
    document.getElementById('more-link').textContent = t('aboutMore');
    document.getElementById('mark-head').textContent = t('markHead');
    document.getElementById('mark-body').textContent = t('markBody');
    document.getElementById('philosophy-head').textContent = t('philosophyHead');
    document.getElementById('philosophy-body').textContent = t('philosophyBody');
  }

  BrerenCommon.applyIncomingPreset();
  currentLang = BrerenCommon.detectLang();

  BrerenCommon.setupLangPicker(function () { return currentLang; }, selectLang);
  BrerenCommon.setupThemeToggle(t);
  setupLogoMark();
  BrerenCommon.applyTheme(BrerenCommon.effectiveTheme(), t);
  BrerenCommon.applyDirection(currentLang);
  applyTexts();

  // ---- logo mark ----------------------------------------------------
  // Static (non-interactive replay) lockup for the card header, plus the
  // interactive header mark that matches index.html's redraw-on-click.

  function setupLogoMark() {
    var mark = document.getElementById('logo-mark');
    var lockup = document.getElementById('mark-lockup');
    var busy = false;

    fetch('../icons/breren-logo-animated.svg', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (svgText) {
        mark.innerHTML = svgText;
        mark.addEventListener('click', replay);
        mark.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            replay();
          }
        });
      })
      .catch(function () {}); // decorative; page works without it

    fetch('../icons/breren-logo.svg', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (svgText) { lockup.innerHTML = svgText; })
      .catch(function () {});

    function replay() {
      if (busy) return;
      var animated = mark.querySelectorAll('.rampart, .hut');
      if (animated.length === 0) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      busy = true;
      mark.setAttribute('aria-disabled', 'true');
      var remaining = animated.length;

      Array.prototype.forEach.call(animated, function (el) { el.style.animation = 'none'; });
      void mark.offsetWidth; // force reflow so the animation restarts
      Array.prototype.forEach.call(animated, function (el) {
        el.style.animation = '';
        el.addEventListener('animationend', onEnd);
      });

      function onEnd(e) {
        e.currentTarget.removeEventListener('animationend', onEnd);
        remaining--;
        if (remaining === 0) {
          busy = false;
          mark.setAttribute('aria-disabled', 'false');
        }
      }
    }
  }
})();
</script>

<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About Breren</title>
<link rel="icon" type="image/svg+xml" href="../icons/breren-logo.svg">
<link rel="alternate icon" href="../icons/breren.ico">
<link rel="stylesheet" href="../common.css">
<style>
  .home-link {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--fg-muted);
    text-decoration: none;
  }
  .home-link:hover { color: var(--accent); }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    box-shadow: 0 2px 8px var(--shadow);
    padding: 1.75rem;
    margin-bottom: 1.5rem;
  }
  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--fg-muted);
    margin: 0 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--card-border);
  }
  .card p {
    color: var(--fg);
    line-height: 1.6;
    margin: 0 0 1rem;
  }
  .card p:last-child { margin-bottom: 0; }
  .pronunciation {
    display: inline-block;
    font-size: 0.85rem;
    color: var(--fg-muted);
    background: var(--bg-alt);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 0.3rem 0.7rem;
    margin: 0 0 1rem;
  }
  .section-head {
    font-size: 0.95rem;
    font-weight: 700;
    margin: 1.5rem 0 0.9rem;
    color: var(--fg);
  }
  .pair {
    margin: 0 0 1.1rem;
  }
  .pair:last-child { margin-bottom: 0; }
  .pair h4 {
    font-size: 0.9rem;
    font-weight: 600;
    margin: 0 0 0.3rem;
    color: var(--fg);
  }
  .pair p { margin: 0; line-height: 1.6; }
  .divider {
    border: none;
    border-top: 1px solid var(--card-border);
    margin: 1.5rem 0;
  }
  .aside {
    font-style: italic;
    color: var(--fg-muted);
    font-size: 0.85rem;
    line-height: 1.6;
    margin: 0;
  }
  .mark-demo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    margin: 0.25rem 0 1.25rem;
  }
  .lockup-pair {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .lockup-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }
  .lockup-frame {
    width: 88px;
    height: 88px;
    border-radius: 12px;
    padding: 8px;
    cursor: pointer;
  }
  .lockup-frame svg { display: block; width: 100%; height: 100%; }
  .lockup-frame:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .lockup-light { background: #edebe4; border: 1px solid #d5c4a1; }
  .lockup-dark  { background: #17191a; border: 1px solid #33302e; }
  .lockup-caption {
    margin: 0;
    font-size: 0.78rem;
    color: var(--fg-muted);
    text-align: center;
  }
  .lockup-hint {
    margin: 0;
    font-size: 0.75rem;
    color: var(--fg-muted);
    text-align: center;
  }
  .swatch-list {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .swatch {
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .swatch-chip {
    flex: none;
    width: 1.7rem;
    height: 1.7rem;
    border-radius: 6px;
    border: 1px solid var(--card-border);
  }
  .swatch p {
    margin: 0;
    color: var(--fg);
    line-height: 1.5;
  }
</style>
</head>
<body>
<main>
  <a class="home-link" id="home-link" href="../"></a>
  <div class="toolbar">
    <div class="lang-picker">
      <button class="lang-trigger" id="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="flag" id="lang-trigger-flag"></span>
        <span id="lang-trigger-name"></span>
        <span class="chevron">▾</span>
      </button>
      <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>
    </div>
    <button class="theme-btn" id="theme-toggle" type="button"></button>
  </div>
  <header>
    <div class="mark" id="logo-mark" role="button" tabindex="0" aria-label="Go to home" aria-disabled="false"></div>
    <h1 id="page-title">Breren</h1>
    <p class="tagline" id="page-tagline"></p>
  </header>

  <section class="card">
    <h2 id="name-head"></h2>
    <p id="name-body"></p>
    <p class="pronunciation">BRER-en — /ˈbrɛr.ən/</p>

    <h3 class="section-head" id="etymology-head"></h3>
    <div class="pair">
      <h4 id="bher-head"></h4>
      <p id="bher-body"></p>
    </div>
    <div class="pair">
      <h4 id="briga-head"></h4>
      <p id="briga-body"></p>
    </div>
    <div class="pair">
      <h4 id="combining-head"></h4>
      <p id="combining-body"></p>
    </div>

    <hr class="divider">
    <p class="aside" id="why-not-aside"></p>
  </section>

  <section class="card">
    <h2 id="mark-head"></h2>
    <p id="mark-body"></p>

    <div class="mark-demo">
      <div class="lockup-pair">
        <div class="lockup-item">
          <div class="lockup-frame lockup-light" id="lockup-light" role="button" tabindex="0" aria-label="Redraw logo"></div>
          <p class="lockup-caption" id="lockup-light-caption"></p>
        </div>
        <div class="lockup-item">
          <div class="lockup-frame lockup-dark" id="lockup-dark" role="button" tabindex="0" aria-label="Redraw logo"></div>
          <p class="lockup-caption" id="lockup-dark-caption"></p>
        </div>
      </div>
      <p class="lockup-hint" id="lockup-hint"></p>
    </div>
  </section>

  <section class="card">
    <h2 id="palette-head"></h2>
    <p id="palette-body"></p>
    <div class="swatch-list">
      <div class="swatch"><span class="swatch-chip" style="background: var(--bg);"></span><p id="swatch-bg"></p></div>
      <div class="swatch"><span class="swatch-chip" style="background: var(--card-bg);"></span><p id="swatch-card"></p></div>
      <div class="swatch"><span class="swatch-chip" style="background: var(--accent);"></span><p id="swatch-accent"></p></div>
      <div class="swatch"><span class="swatch-chip" style="background: var(--fg);"></span><p id="swatch-ink"></p></div>
    </div>
  </section>

  <section class="card">
    <h2 id="philosophy-head"></h2>
    <p id="philosophy-body"></p>
    <hr class="divider">
    <h4 id="oral-digital-head"></h4>
    <p id="oral-digital-body"></p>
  </section>

  <footer>
    <a id="home-link-2" href="../"></a>
    <span class="footer-sep">·</span>
    <a id="license-link" href="/licenses/pbl">PayBack License (PBL) 2.0</a>
  </footer>
</main>

      whyNotAside: 'Lugus, Nabia, Avalon ਜਾਂ Briga ਵਰਗੇ ਨਾਮ ਪਹਿਲਾਂ ਹੀ ਮਜ਼ਬੂਤ ਇਤਿਹਾਸਕ ਸੰਬੰਧ ਰੱਖਦੇ ਹਨ — ਉਹ ਇੱਕ ਅਜਿਹੀ ਕਹਾਣੀ ਦੱਸਦੇ ਹਨ ਜੋ ਪਹਿਲਾਂ ਤੋਂ ਮੌਜੂਦ ਹੈ। Breren ਨੂੰ ਇਹਨਾਂ ਵਿੱਚੋਂ ਕਿਸੇ ਇੱਕ ਵਰਗਾ ਲੱਗਣ ਲਈ ਬਣਾਇਆ ਗਿਆ ਹੈ, ਬਿਨਾਂ ਉਹ ਹੋਏ, ਤਾਂ ਜੋ ਕੰਪਨੀ ਆਪਣੀ ਖੁਦ ਦੀ ਕਹਾਣੀ ਲਿਖ ਸਕੇ, ਜਿਵੇਂ Google, Kodak ਜਾਂ Spotify ਨੇ ਕੀਤਾ: ਅਰਥ ਕੰਮ ਤੋਂ ਹੀ ਉੱਭਰਦਾ ਹੈ।',
      philosophyHead: 'ਦਰਸ਼ਨ',
      philosophyBody: 'ਪ੍ਰਾਚੀਨ ਭਾਈਚਾਰੇ ਯਾਦ ਅਤੇ ਮੁੜ-ਕਥਨ ਰਾਹੀਂ ਗਿਆਨ ਨੂੰ ਜ਼ਿੰਦਾ ਰੱਖਦੇ ਸਨ। ਸਾਫਟਵੇਅਰ ਹੁਣ ਉਹੀ ਕੰਮ ਚੁੱਕਦਾ ਹੈ: ਜੋ ਬਣਾਇਆ ਜਾਂਦਾ ਹੈ ਉਸਨੂੰ ਯਾਦ ਰੱਖਣਾ ਚਾਹੀਦਾ ਹੈ, ਤਾਂ ਜੋ ਲੋਕਾਂ ਨੂੰ ਦੁਬਾਰਾ ਸ਼ੁਰੂ ਨਾ ਕਰਨਾ ਪਵੇ।',
      paletteHead: 'ਰੰਗ ਪੈਲੇਟ',
      paletteBody: 'Breren Gruvbox ਵਰਤਦਾ ਹੈ — ਲੰਬੇ ਸਮੇਂ ਲਈ ਪੜ੍ਹਨ ਵਾਸਤੇ ਬਣਾਇਆ ਗਰਮ, ਘੱਟ-ਕੰਟਰਾਸਟ ਪੈਲੇਟ, ਜਿਸ ਵਿੱਚ ਹਲਕੇ ਅਤੇ ਗੂੜ੍ਹੇ ਲਈ ਮੇਲ ਖਾਂਦੇ ਰੰਗਾਂ ਦਾ ਜੋੜਾ ਹੈ।',
      swatchBg: 'ਪਿਛੋਕੜ — ਡੂੰਘਾ, ਮੱਧਮ ਰੰਗ ਜਿਸ ਉੱਤੇ ਪੂਰਾ ਸਫ਼ਾ ਟਿਕਿਆ ਹੈ।',
      swatchCard: 'ਕਾਰਡ — ਥੋੜ੍ਹਾ ਹਲਕਾ ਰੰਗ, ਜੋ ਹਰੇਕ ਭਾਗ ਨੂੰ ਆਪਣੀ ਸਤਹ ਦਿੰਦਾ ਹੈ।',
      swatchAccent: 'ਉਭਾਰ — ਸੜਿਆ ਸੰਤਰੀ, ਹਰੇਕ ਦ੍ਰਿਸ਼ ਵਿੱਚ ਇੱਕ ਵਾਰ ਲਿੰਕਾਂ ਅਤੇ ਫੋਕਸ ਲਈ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ।',
      swatchInk: 'ਸਿਆਹੀ — ਲਿਖਤ ਅਤੇ ਨਿਸ਼ਾਨ ਦਾ ਰੰਗ।'
    }
  };

  var currentLang;

  // Static (non-media-query) source colors for the mark card's light/dark
  // lockups, copied from icons/breren-logo.svg's default and dark blocks.
  // Declared here (ahead of setupMarkCard()'s call site further down) so
  // they're already assigned by the time it runs synchronously - `var`
  // hoisting only lifts the declaration, not the assignment, so defining
  // these next to the functions that use them (as before) left them
  // `undefined` at the moment setupLockup() captured them into its closure.
  var LIGHT_PALETTE = { outer: '#33302e', middle: '#4a4542', inner: '#635d59', hut: '#6b4423' };
  var DARK_PALETTE = { outer: '#b0a696', middle: '#a39d95', inner: '#928878', hut: '#c9944f' };

  function t(key, vars) {
    var dict = STRINGS[currentLang] || STRINGS.gl;
    var common = BrerenCommon.COMMON_STRINGS[currentLang] || BrerenCommon.COMMON_STRINGS.gl;
    var str = dict[key] || common[key] || STRINGS.gl[key] || BrerenCommon.COMMON_STRINGS.gl[key] || key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        str = str.replace('{' + k + '}', vars[k]);
      });
    }
    return str;
  }

  function selectLang(code) {
    currentLang = code;
    localStorage.setItem('breren-lang', code);
    document.documentElement.lang = code;
    BrerenCommon.applyDirection(code);
    applyTexts();
  }

  function applyTexts() {
    document.title = t('aboutTitle');
    document.getElementById('page-tagline').textContent = t('tagline');
    document.getElementById('home-link').textContent = t('backToHome');
    document.getElementById('home-link-2').textContent = t('backToHome');
    document.getElementById('name-head').textContent = t('nameHead');
    document.getElementById('name-body').textContent = t('aboutOrigin');
    document.getElementById('etymology-head').textContent = t('etymologyHead');
    document.getElementById('bher-head').textContent = t('bherHead');
    document.getElementById('bher-body').textContent = t('bherBody');
    document.getElementById('briga-head').textContent = t('brigaHead');
    document.getElementById('briga-body').textContent = t('brigaBody');
    document.getElementById('combining-head').textContent = t('combiningHead');
    document.getElementById('combining-body').textContent = t('combiningBody');
    document.getElementById('why-not-aside').textContent = t('whyNotAside');
    document.getElementById('mark-head').textContent = t('markHead');
    document.getElementById('mark-body').textContent = t('markBody');
    document.getElementById('lockup-light-caption').textContent = t('lockupLight');
    document.getElementById('lockup-dark-caption').textContent = t('lockupDark');
    document.getElementById('lockup-hint').textContent = t('lockupHint');
    document.getElementById('palette-head').textContent = t('paletteHead');
    document.getElementById('palette-body').textContent = t('paletteBody');
    document.getElementById('swatch-bg').textContent = t('swatchBg');
    document.getElementById('swatch-card').textContent = t('swatchCard');
    document.getElementById('swatch-accent').textContent = t('swatchAccent');
    document.getElementById('swatch-ink').textContent = t('swatchInk');
    document.getElementById('philosophy-head').textContent = t('philosophyHead');
    document.getElementById('philosophy-body').textContent = t('philosophyBody');
    document.getElementById('oral-digital-head').textContent = t('oralDigitalHead');
    document.getElementById('oral-digital-body').textContent = t('oralDigitalBody');
  }

  BrerenCommon.applyIncomingPreset();
  currentLang = BrerenCommon.detectLang();

  BrerenCommon.setupLangPicker(function () { return currentLang; }, selectLang);
  setupMarkCard();
  BrerenCommon.setupThemeToggle(t);
  setupLogoMark();
  BrerenCommon.applyTheme(BrerenCommon.effectiveTheme(), t);
  BrerenCommon.applyDirection(currentLang);
  applyTexts();

  // ---- logo mark ----------------------------------------------------
  // Interactive header mark that matches index.html's redraw-on-click.

  function setupLogoMark() {
    var mark = document.getElementById('logo-mark');
    var busy = false;

    fetch('../icons/breren-logo-animated.svg', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (svgText) {
        mark.innerHTML = svgText;
        mark.addEventListener('click', replay);
        mark.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            replay();
          }
        });
      })
      .catch(function (err) { console.error('header mark failed to load/render', err); }); // decorative; page works without it

    function replay() {
      if (busy) {
        window.location.href = '../';
        return;
      }
      var animated = mark.querySelectorAll('.rampart, .hut');
      if (animated.length === 0 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        window.location.href = '../';
        return;
      }

      busy = true;
      mark.setAttribute('aria-disabled', 'true');
      var remaining = animated.length;

      Array.prototype.forEach.call(animated, function (el) { el.style.animation = 'none'; });
      void mark.offsetWidth; // force reflow so the animation restarts
      Array.prototype.forEach.call(animated, function (el) {
        el.style.animation = '';
        el.addEventListener('animationend', onEnd);
      });

      function onEnd(e) {
        e.currentTarget.removeEventListener('animationend', onEnd);
        remaining--;
        if (remaining === 0) {
          busy = false;
          mark.setAttribute('aria-disabled', 'false');
          window.location.href = '../';
        }
      }
    }
  }

  // ---- mark card: light/dark lockups, click = redraw, double-click = spin
  //
  // The mark's colors normally switch via `@media (prefers-color-scheme)`
  // inside the fetched SVGs, which tracks the OS setting, not this page's
  // own light/dark toggle. The two lockups below need to show a *specific*
  // ground regardless of that toggle, so each fetched SVG gets a forced
  // color override appended as its own <style> block.
  //
  // Both lockups fetch and inject the *same* markup (draw-in reveal svg,
  // then swapped for the spin svg on double-click), each into its own
  // shadow root. Without that isolation, both copies' <style> blocks
  // (identical class names and @keyframes, appended via innerHTML) become
  // ordinary global stylesheet rules rather than being scoped to the
  // fragment they arrived in — the later-inserted copy's rules then win
  // the cascade for *every* instance on the page (including the header's
  // own mark), and redefining running @keyframes out from under the
  // earlier copy's in-flight animation resets it before it can finish
  // drawing. A shadow root keeps each lockup's styles and keyframes
  // entirely local, so the two never fight over the same rules.
  //
  // LIGHT_PALETTE/DARK_PALETTE are declared near the top of the script,
  // ahead of setupMarkCard()'s call site - see the comment there.
  //
  // Both overrides also force the root <svg>'s own size: the light-DOM
  // `.lockup-frame svg` sizing rule can't reach in here once this markup
  // lives inside a shadow root, so without this the fetched SVG would
  // render at its native 512x512 intrinsic size instead of filling the
  // 88px frame.
  var SIZE_RULE = 'svg{display:block !important;width:100% !important;height:100% !important}';

  function forceFlatColors(svgText, palette) {
    var override =
      '<style>' + SIZE_RULE +
      '.outer{stroke:' + palette.outer + ' !important}' +
      '.middle{stroke:' + palette.middle + ' !important}' +
      '.inner{stroke:' + palette.inner + ' !important}' +
      '.hut{fill:' + palette.hut + ' !important}</style>';
    return svgText.replace('</svg>', override + '</svg>');
  }

  // breren-logo-spin.svg paints its ramparts with gradient fills (already
  // shipped in both a light and a `-dark` id variant) rather than flat
  // colors, so forcing a ground here means forcing which gradient id each
  // rampart references, not a literal color.
  function forceGradientColors(svgText, dark, palette) {
    var suffix = dark ? '-dark' : '';
    var override =
      '<style>' + SIZE_RULE +
      '.outer{stroke:url(#g-outer' + suffix + ') !important}' +
      '.middle{stroke:url(#g-middle' + suffix + ') !important}' +
      '.inner{stroke:url(#g-inner' + suffix + ') !important}' +
      '.hut{fill:' + palette.hut + ' !important}</style>';
    return svgText.replace('</svg>', override + '</svg>');
  }

  // One lockup: fetches both source SVGs once, then lets `playDraw`/
  // `playSpin` repaint its private shadow root on demand.
  function setupLockup(host, dark) {
    var palette = dark ? DARK_PALETTE : LIGHT_PALETTE;
    var root = host.attachShadow({ mode: 'open' });
    var drawSvgText = null;
    var spinSvgText = null;
    var busy = false;

    function playDraw() {
      if (busy || !drawSvgText) return;
      busy = true;
      root.innerHTML = forceFlatColors(drawSvgText, palette);
      var animated = root.querySelectorAll('.rampart, .hut');
      if (animated.length === 0 || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        busy = false;
        return;
      }
      var remaining = animated.length;
      Array.prototype.forEach.call(animated, function (el) {
        el.addEventListener('animationend', function onEnd(e) {
          e.currentTarget.removeEventListener('animationend', onEnd);
          remaining--;
          if (remaining === 0) busy = false;
        });
      });
    }

    function playSpin() {
      if (busy || !spinSvgText) return;
      root.innerHTML = forceGradientColors(spinSvgText, dark, palette);
      // Runs on an infinite CSS loop (a loading-indicator, not a one-shot
      // reveal) until the next click swaps the draw svg back in, so there's
      // no `animationend` to wait on and no busy-lock to hold here.
    }

    fetch('../icons/breren-logo-animated.svg', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (svgText) {
        drawSvgText = svgText;
        playDraw();
      })
      .catch(function (err) { console.error('mark lockup draw svg failed to load/render', err); }); // decorative; page works without it

    fetch('../icons/breren-logo-spin.svg', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (svgText) { spinSvgText = svgText; })
      .catch(function (err) { console.error('mark lockup spin svg failed to load', err); });

    return { playDraw: playDraw, playSpin: playSpin };
  }

  // Native `click`/`dblclick` both fire on a double-click (click, click,
  // dblclick, in that order), so a naive click handler would replay the
  // reveal twice before the spin ever got a chance to run. Hold each click
  // for the standard double-click window and only act on it if a second
  // click doesn't arrive to promote it to a double-click instead.
  function wireGestures(host, lockup) {
    var clickTimer = null;
    host.addEventListener('click', function () {
      if (clickTimer) return;
      clickTimer = setTimeout(function () {
        clickTimer = null;
        lockup.playDraw();
      }, 300);
    });
    host.addEventListener('dblclick', function () {
      clearTimeout(clickTimer);
      clickTimer = null;
      lockup.playSpin();
    });
    host.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        lockup.playDraw();
      }
    });
  }

  function setupMarkCard() {
    var lightLockup = setupLockup(document.getElementById('lockup-light'), false);
    var darkLockup = setupLockup(document.getElementById('lockup-dark'), true);
    wireGestures(document.getElementById('lockup-light'), lightLockup);
    wireGestures(document.getElementById('lockup-dark'), darkLockup);
  }
})();
</script>

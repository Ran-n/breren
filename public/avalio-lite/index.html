    display: inline-flex;

  .btn-text { display: flex; flex-direction: column; align-items: flex-start; text-align: start; }
  .btn-hint { font-size: 0.74rem; font-weight: 500; opacity: 0.85; margin-top: 0.1rem; }
  .btn-lg {
    padding: 0.85rem 1.5rem;
    font-size: 1.05rem;
    min-width: 17rem;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .btn-lg:hover { transform: translateY(-2px); box-shadow: 0 6px 16px var(--shadow); }
  .btn-download {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-md {
    padding: 0.55rem 1rem;
    font-size: 0.9rem;
    color: var(--fg);
    border: 1px solid var(--card-border);
    background: var(--card-bg);
  }
  .btn-md:hover { border-color: var(--accent); }
  .btn-sm {
    padding: 0.35rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--fg-muted);
    border: 1px solid var(--card-border);
    background: var(--card-bg);
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--fg); }
  .notes {
    max-width: 36rem;
    margin: 0 auto 1.4rem;
    padding: 0.85rem 1rem;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    background: var(--card-bg);
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--fg-muted);
  }
  .notes p { margin: 0; }
  .notes p + p { margin-top: 0.5rem; }
  .notes a { color: var(--fg); text-underline-offset: 2px; overflow-wrap: anywhere; }
  .notes a:hover { color: var(--accent); }
  .version-note {
    text-align: center;
    font-size: 0.8rem;
    color: var(--fg-muted);
    margin: 0 0 1.4rem;
  }
  .version-note a { color: var(--fg-muted); text-underline-offset: 2px; }
  .version-note a:hover { color: var(--accent); }
  .shots { margin-top: 3rem; }
  .shots-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.5rem 1.25rem;
    margin-top: 1.5rem;
  }
  .shots figure { margin: 0; text-align: center; }
  .shots img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    box-shadow: 0 2px 8px var(--shadow);
  }
  /* Each screenshot comes in the app's light and dark theme; show the one
     matching the page. Hidden lazy images are never fetched. */
  html[data-theme="dark"] .shot-light,
  html[data-theme="light"] .shot-dark { display: none; }
  .shots figcaption {
    margin-top: 0.55rem;
    font-size: 0.85rem;
    color: var(--fg-muted);
  }
  @media (max-width: 560px) {
    main { padding: 5rem 1rem 4rem; }
    .btn-lg { min-width: 0; width: 100%; }

      })
      .then(function (release) {
        Object.keys(ASSET_SUFFIX).forEach(function (id) {
          var asset = (release.assets || []).filter(function (a) {
            return a.name.slice(-ASSET_SUFFIX[id].length) === ASSET_SUFFIX[id];
          })[0];
          if (asset) document.getElementById(id).href = asset.browser_download_url;
          else console.warn('avalio-lite: no release asset ending in ' + ASSET_SUFFIX[id] + ' in ' + release.tag_name);
        });
        if (release.tag_name) document.getElementById('version-tag').textContent = ' · ' + release.tag_name;
      })
      .catch(function (err) {
        console.warn('avalio-lite: could not resolve the latest release, download buttons stay on the releases page:', err);
      });
  }

  BrerenCommon.applyIncomingPreset();
  currentLang = BrerenCommon.detectLang();
  document.documentElement.lang = currentLang;

  BrerenCommon.setupLangPicker(function () { return currentLang; }, selectLang);
  BrerenCommon.setupThemeToggle(t);
  BrerenCommon.applyTheme(BrerenCommon.effectiveTheme(), t);
  BrerenCommon.applyDirection(currentLang);
  applyTexts();
  resolveDownloads();

  // Returning via the back button restores this page from the bfcache,
  // so re-read lang/theme in case they changed on another breren.com page.
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    currentLang = BrerenCommon.detectLang();
    BrerenCommon.applyTheme(BrerenCommon.effectiveTheme(), t);
    BrerenCommon.applyDirection(currentLang);
    applyTexts();
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="gl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  var t = localStorage.getItem('breren-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  html[data-theme="dark"] { background: #282828; }
  html[data-theme="light"] { background: #fbf1c7; }
</style>
<title>Breren</title>
<link rel="icon" type="image/svg+xml" href="icons/breren-logo.svg">
<link rel="alternate icon" href="icons/breren.ico">
<link rel="stylesheet" href="common.css">
<style>
  .category {
    margin-bottom: 2.5rem;
  }
  .category h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--fg-muted);
    margin: 0 0 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--card-border);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1rem;
  }
  a.tile {
    display: flex;
    align-items: flex-start;
    gap: 0.8rem;
    padding: 1.1rem;
    border-radius: 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  a.tile:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px var(--shadow);
    border-color: var(--accent);
  }
  .tile-icon {
    flex: none;
    width: 2.4rem;
    height: 2.4rem;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    background: color-mix(in srgb, var(--tile-color, var(--accent)) 25%, transparent);
    overflow: hidden;
  }
  .tile-icon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tile-text {
    min-width: 0;
  }
  .tile-name {
    font-weight: 600;
    font-size: 0.98rem;
    margin: 0 0 0.15rem;
    overflow-wrap: break-word;
  }
  .tile-desc {
    font-size: 0.82rem;
    color: var(--fg-muted);
    margin: 0;
    line-height: 1.35;
  }
  .empty, .error {
    text-align: center;
    color: var(--fg-muted);
    padding: 2rem 0;
  }
</style>
</head>
<body>
<main>
  <div class="toolbar">
    <div class="lang-picker">
      <button class="lang-trigger" id="lang-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="flag" id="lang-trigger-flag"></span>
        <span id="lang-trigger-name"></span>
        <span class="chevron">▾</span>
      </button>
      <ul class="lang-menu" id="lang-menu" role="listbox" hidden></ul>
    </div>
    <button class="theme-btn" id="theme-toggle" type="button"></button>
  </div>
  <header>
    <div class="mark" id="logo-mark" role="button" tabindex="0" aria-label="Redraw logo" aria-disabled="false"></div>
    <h1 id="page-title">Breren</h1>
    <p class="tagline" id="page-tagline"></p>
  </header>
  <div id="content"></div>
  <footer>
    <a id="about-link" href="about/"></a>
    <span class="footer-sep">·</span>
    <a id="license-link" href="/licenses/pbl">PayBack License (PBL) 2.0</a>
  </footer>
</main>
<script src="common.js"></script>
<script>
(function () {
  var LINKS_FILE = 'links.toml';
  var TRANSLATIONS_FILE = 'translations.toml';

  var STRINGS = {
    gl: {
      empty: 'Aínda non hai ligazóns — engade algunhas a {file}.',
      errorPrefix: 'Non se puido cargar {file}',
      aboutLink: 'Sobre Breren'
    },
    en: {
      empty: 'No links yet — add some to {file}.',
      errorPrefix: 'Could not load {file}',
      aboutLink: 'About Breren'
    },
    eo: {
      empty: 'Ankoraŭ neniuj ligiloj — aldonu kelkajn al {file}.',
      errorPrefix: 'Ne eblis ŝargi {file}',
      aboutLink: 'Pri Breren'
    },
    es: {
      empty: 'Aún no hay enlaces — añade algunos a {file}.',
      errorPrefix: 'No se pudo cargar {file}',
      aboutLink: 'Sobre Breren'
    },
    fr: {
      empty: 'Pas encore de liens — ajoutez-en dans {file}.',
      errorPrefix: 'Impossible de charger {file}',
      aboutLink: 'À propos de Breren'
    },
    pt: {
      empty: 'Ainda sem links — adicione alguns a {file}.',
      errorPrefix: 'Não foi possível carregar {file}',
      aboutLink: 'Sobre a Breren'
    },
    de: {
      empty: 'Noch keine Links — füge welche zu {file} hinzu.',
      errorPrefix: '{file} konnte nicht geladen werden',
      aboutLink: 'Über Breren'
    },
    it: {
      empty: 'Ancora nessun link — aggiungine in {file}.',
      errorPrefix: 'Impossibile caricare {file}',
      aboutLink: 'Informazioni su Breren'
    },
    ru: {
      empty: 'Пока нет ссылок — добавьте их в {file}.',
      errorPrefix: 'Не удалось загрузить {file}',
      aboutLink: 'О Breren'
    },
    zh: {
      empty: '还没有链接——请在 {file} 中添加。',
      errorPrefix: '无法加载 {file}',
      aboutLink: '关于 Breren'
    },
    ja: {
      empty: 'まだリンクがありません — {file} に追加してください。',
      errorPrefix: '{file} を読み込めませんでした',
      aboutLink: 'Breren について'
    },
    ko: {
      empty: '아직 링크가 없습니다 — {file} 에 추가하세요.',
      errorPrefix: '{file} 을(를) 불러올 수 없습니다',
      aboutLink: 'Breren 소개'
    },
    ar: {
      empty: 'لا توجد روابط بعد — أضف بعضها إلى {file}.',
      errorPrefix: 'تعذّر تحميل {file}',
      aboutLink: 'عن Breren'
    },
    hi: {
      empty: 'अभी कोई लिंक नहीं है — {file} में कुछ जोड़ें।',
      errorPrefix: '{file} लोड नहीं हो सका',
      aboutLink: 'Breren के बारे में'
    },
    bn: {
      empty: 'এখনো কোনো লিঙ্ক নেই — {file}-এ কিছু যোগ করুন।',
      errorPrefix: '{file} লোড করা যায়নি',
      aboutLink: 'Breren সম্পর্কে'
    },
    ur: {
      empty: 'ابھی تک کوئی لنک نہیں — {file} میں کچھ شامل کریں۔',
      errorPrefix: '{file} لوڈ نہیں ہو سکی',
      aboutLink: 'Breren کے بارے میں'
    },
    fa: {
      empty: 'هنوز پیوندی وجود ندارد — چند مورد به {file} اضافه کنید.',
      errorPrefix: 'بارگذاری {file} ممکن نشد',
      aboutLink: 'درباره Breren'
    },
    tr: {
      empty: 'Henüz bağlantı yok — {file} dosyasına birkaç tane ekleyin.',
      errorPrefix: '{file} yüklenemedi',
      aboutLink: 'Breren Hakkında'
    },
    vi: {
      empty: 'Chưa có liên kết nào — hãy thêm vào {file}.',
      errorPrefix: 'Không thể tải {file}',
      aboutLink: 'Về Breren'
    },
    id: {
      empty: 'Belum ada tautan — tambahkan beberapa di {file}.',
      errorPrefix: 'Tidak dapat memuat {file}',
      aboutLink: 'Tentang Breren'
    },
    th: {
      empty: 'ยังไม่มีลิงก์ — เพิ่มลงใน {file}',
      errorPrefix: 'โหลด {file} ไม่สำเร็จ',
      aboutLink: 'เกี่ยวกับ Breren'
    },
    sw: {
      empty: 'Bado hakuna viungo — ongeza baadhi kwenye {file}.',
      errorPrefix: 'Imeshindwa kupakia {file}',
      aboutLink: 'Kuhusu Breren'
    },
    te: {
      empty: 'ఇంకా లింక్‌లు లేవు — {file}కు కొన్ని జోడించండి.',
      errorPrefix: '{file}ను లోడ్ చేయలేకపోయాము',
      aboutLink: 'Breren గురించి'
    },
    ta: {
      empty: 'இதுவரை இணைப்புகள் இல்லை — {file} இல் சிலவற்றைச் சேர்க்கவும்.',
      errorPrefix: '{file} ஐ ஏற்ற முடியவில்லை',
      aboutLink: 'Breren பற்றி'
    },
    pa: {
      empty: 'ਹਾਲੇ ਕੋਈ ਲਿੰਕ ਨਹੀਂ — {file} ਵਿੱਚ ਕੁਝ ਸ਼ਾਮਲ ਕਰੋ।',
      errorPrefix: '{file} ਲੋਡ ਨਹੀਂ ਹੋ ਸਕੀ',
      aboutLink: 'Breren ਬਾਰੇ'
    }
  };

  var currentLang;
  var latestData = null;
  var latestError = null;
  var translations = {};

  BrerenCommon.applyIncomingPreset();
  currentLang = BrerenCommon.detectLang();

  BrerenCommon.setupLangPicker(function () { return currentLang; }, selectLang);
  BrerenCommon.setupThemeToggle(t);
  setupLogoMark();
  BrerenCommon.applyTheme(BrerenCommon.effectiveTheme(), t);
  BrerenCommon.applyDirection(currentLang);
  applyTexts();

  fetchTOML(TRANSLATIONS_FILE)
    .then(function (data) { translations = data; if (latestData) render(latestData); })
    .catch(function () { translations = {}; }); // optional file; missing/broken -> no translations

  fetchTOML(LINKS_FILE)
    .then(function (data) { latestData = data; render(data); })
    .catch(function (err) {
      latestError = err;
      renderError(err);
    });

  function fetchTOML(file) {
    return fetch(file, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error(file + ' responded with ' + r.status);
        return r.text();
      })
      .then(parseTOML);
  }

  // ---- i18n ----------------------------------------------------------

  function t(key, vars) {
    var dict = STRINGS[currentLang] || STRINGS.gl;
    var common = BrerenCommon.COMMON_STRINGS[currentLang] || BrerenCommon.COMMON_STRINGS.gl;
    var str = dict[key] || common[key] || STRINGS.gl[key] || BrerenCommon.COMMON_STRINGS.gl[key] || key;
    if (vars) {
      Object.keys(vars).forEach(function (k) {
        str = str.replace('{' + k + '}', vars[k]);
      });
    }
    return str;
  }

  // Looks up `<base>_<currentLang>` (e.g. `name_es`) for a links.toml
  // category/item, in this priority order: translations.toml's table for
  // this object's `id`, then an inline `<base>_<code>` field on the
  // object itself (kept as an escape hatch), then the plain `<base>`
  // field untranslated. Translations are written by hand — ask to have a
  // new tile translated when you add it; there's no runtime translation.
  function localized(obj, base) {
    var key = base + '_' + currentLang;
    var fromFile = obj.id && translations[obj.id];
    if (fromFile && fromFile[key]) return fromFile[key];
    return obj[key] || obj[base];
  }

  function selectLang(code) {
    currentLang = code;
    localStorage.setItem('breren-lang', code);
    document.documentElement.lang = code;
    BrerenCommon.applyDirection(code);
    applyTexts();
  }

  function applyTexts() {
    document.getElementById('page-tagline').textContent = t('tagline');
    document.getElementById('about-link').textContent = t('aboutLink');
    if (latestData) render(latestData);
    else if (latestError) renderError(latestError);
  }

  // ---- logo mark ----------------------------------------------------

  function setupLogoMark() {
    var mark = document.getElementById('logo-mark');
    var busy = false;

    fetch('icons/breren-logo-animated.svg', { cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (svgText) {
        mark.innerHTML = svgText;
        mark.addEventListener('click', replay);
        mark.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            replay();
          }
        });
      })
      .catch(function () {}); // decorative; page works without it

    function replay() {
      if (busy) return;
      var animated = mark.querySelectorAll('.rampart, .hut');
      if (animated.length === 0) return;
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      busy = true;
      mark.setAttribute('aria-disabled', 'true');
      var remaining = animated.length;

      Array.prototype.forEach.call(animated, function (el) { el.style.animation = 'none'; });
      void mark.offsetWidth; // force reflow so the animation restarts
      Array.prototype.forEach.call(animated, function (el) {
        el.style.animation = '';
        el.addEventListener('animationend', onEnd);
      });

      function onEnd(e) {
        e.currentTarget.removeEventListener('animationend', onEnd);
        remaining--;
        if (remaining === 0) {
          busy = false;
          mark.setAttribute('aria-disabled', 'false');
        }
      }
    }
  }

  // ---- TOML parsing ----------------------------------------------------

  // Minimal TOML subset parser: top-level string/bool/number keys, plus
  // [[array.of.tables]] headers nested the way TOML actually nests them
  // (a new [[a.b]] entry attaches under the most recently created [[a]]).
  // Good enough for this page's schema; not a general TOML implementation.
  function parseTOML(text) {
    var root = {};
    var current = root;
    var lines = text.split(/\r?\n/);

    lines.forEach(function (raw) {
      var line = raw.trim();
      if (!line || line.charAt(0) === '#') return;

      var arrayHeader = line.match(/^\[\[(.+)\]\]$/);
      if (arrayHeader) {
        current = descend(root, arrayHeader[1].split('.'), true);
        return;
      }

      var tableHeader = line.match(/^\[(.+)\]$/);
      if (tableHeader) {
        current = descend(root, tableHeader[1].split('.'), false);
        return;
      }

      var eq = line.indexOf('=');
      if (eq === -1) return;
      var key = line.slice(0, eq).trim();
      current[key] = parseValue(line.slice(eq + 1));
    });

    return root;

    function descend(container, path, isArrayLeaf) {
      for (var i = 0; i < path.length - 1; i++) {
        var key = path[i].trim();
        if (!container[key]) container[key] = [];
        var arr = container[key];
        if (arr.length === 0) arr.push({});
        container = arr[arr.length - 1];
      }
      var lastKey = path[path.length - 1].trim();
      if (isArrayLeaf) {
        if (!container[lastKey]) container[lastKey] = [];
        var table = {};
        container[lastKey].push(table);
        return table;
      }
      if (!container[lastKey]) container[lastKey] = {};
      return container[lastKey];
    }

    function parseValue(raw) {
      var v = raw.trim();
      if (v.charAt(0) === '"') {
        var out = '';
        for (var i = 1; i < v.length; i++) {
          if (v.charAt(i) === '\\') { out += v.charAt(i + 1); i++; continue; }
          if (v.charAt(i) === '"') break;
          out += v.charAt(i);
        }
        return out;
      }
      var hashIdx = v.indexOf('#');
      if (hashIdx !== -1) v = v.slice(0, hashIdx).trim();
      if (v === 'true') return true;
      if (v === 'false') return false;
      if (v !== '' && !isNaN(Number(v))) return Number(v);
      return v;
    }
  }

  // ---- rendering ----------------------------------------------------

  function render(data) {
    if (data.title) document.getElementById('page-title').textContent = data.title;
    document.title = data.title || 'Breren';

    var container = document.getElementById('content');
    container.innerHTML = '';
    var categories = Array.isArray(data.categories) ? data.categories : [];

    if (categories.length === 0) {
      container.innerHTML = '<p class="empty">' + escapeHtml(t('empty', { file: LINKS_FILE })) + '</p>';
      return;
    }

    categories.forEach(function (cat) {
      var section = document.createElement('section');
      section.className = 'category';

      var catName = localized(cat, 'name');
      if (catName) {
        var h2 = document.createElement('h2');
        h2.textContent = catName;
        section.appendChild(h2);
      }

      var grid = document.createElement('div');
      grid.className = 'grid';

      (cat.items || []).forEach(function (item) {
        grid.appendChild(renderTile(item));
      });

      section.appendChild(grid);
      container.appendChild(section);
    });
  }

  function renderError(err) {
    document.getElementById('content').innerHTML =
      '<p class="error">' + escapeHtml(t('errorPrefix', { file: LINKS_FILE })) +
      ' (' + escapeHtml(err.message) + ').</p>';
  }

  function renderTile(item) {
    var a = document.createElement('a');
    a.className = 'tile';
    a.href = item.url || '#';
    if (item.url && /^https?:\/\//i.test(item.url) && new URL(item.url, location.href).origin !== location.origin) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    }
    if (item.color) a.style.setProperty('--tile-color', item.color);

    var itemName = localized(item, 'name');
    var itemDesc = localized(item, 'description');

    var icon = document.createElement('div');
    icon.className = 'tile-icon';
    if (item.icon && /\.(svg|png|jpe?g|webp|gif)$/i.test(item.icon)) {
      var img = document.createElement('img');
      img.src = item.icon;
      img.alt = '';
      icon.appendChild(img);
    } else {
      icon.textContent = item.icon || (itemName ? itemName.charAt(0).toUpperCase() : '?');
    }

    var text = document.createElement('div');
    text.className = 'tile-text';

    var name = document.createElement('p');
    name.className = 'tile-name';
    name.textContent = itemName || item.url || 'Untitled';
    text.appendChild(name);

    if (itemDesc) {
      var desc = document.createElement('p');
      desc.className = 'tile-desc';
      desc.textContent = itemDesc;
      text.appendChild(desc);
    }

    a.appendChild(icon);
    a.appendChild(text);
    return a;
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=/licenses/pbl">
<link rel="canonical" href="/licenses/pbl">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  var t = localStorage.getItem('breren-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  html[data-theme="dark"] { background: #282828; }
  html[data-theme="light"] { background: #fbf1c7; }
</style>
<title>PayBack License</title>
</head>
<body>

</body>

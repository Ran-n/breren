<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>
(function () {
  var t = localStorage.getItem('breren-theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<title>PayBack License</title>
<link rel="icon" type="image/svg+xml" href="../../icons/breren-logo.svg">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  html[data-theme="dark"] { background: #282828; }
  html[data-theme="light"] { background: #fbf1c7; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="pbl-frame" src="https://ran-n.github.io/doc/" title="PayBack License" allowfullscreen></iframe>
<script>
  // breren.com only writes breren-lang/breren-theme once the visitor
  // explicitly picks something - on a first-ever visit neither is set,
  // so a raw localStorage read sends null/null and the hand-off silently
  // does nothing. Mirror breren.com's own fallback logic (same supported
  // languages, same browser-language/prefers-color-scheme detection) so
  // the very first visit hands off breren's actual displayed lang/theme,
  // not just whatever's been explicitly saved.
  var SUPPORTED_LANGS = ['gl', 'en', 'zh', 'hi', 'es', 'ar', 'fr', 'bn', 'pt', 'ru', 'ur', 'id', 'de', 'ja', 'sw', 'te', 'tr', 'ta', 'vi', 'ko', 'it', 'fa', 'pa', 'th', 'eo'];
  function detectLang() {
    var stored = localStorage.getItem('breren-lang');
    if (stored && SUPPORTED_LANGS.indexOf(stored) !== -1) return stored;
    var candidates = navigator.languages || [navigator.language || 'gl'];
    for (var i = 0; i < candidates.length; i++) {
      var code = (candidates[i] || '').slice(0, 2).toLowerCase();
      if (SUPPORTED_LANGS.indexOf(code) !== -1) return code;
    }
    return 'gl';
  }
  function effectiveTheme() {
    var stored = localStorage.getItem('breren-theme');
    if (stored) return stored;
    return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  var frame = document.getElementById('pbl-frame');
  function sendPreset() {
    frame.contentWindow.postMessage({
      type: 'rn-preset',
      lang: detectLang(),
      theme: effectiveTheme()
    }, 'https://ran-n.github.io');
  }
  frame.addEventListener('load', sendPreset);
  // Returning via the browser's back button restores this page (and its
  // iframe) from the bfcache instead of firing 'load' again, so a lang/theme
  // change made on breren.com in between would otherwise never reach the
  // iframe. 'pageshow' fires on both a fresh load and a bfcache restore.
  window.addEventListener('pageshow', sendPreset);
</script>
</body>
</html>

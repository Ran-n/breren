<style>
  .home-link {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--fg-muted);
  }
  .app-icon {
    display: block;
    width: 96px;
    height: 96px;
    margin: 0 auto 0.75rem;
  }
  h1 { text-transform: none; letter-spacing: 0.02em; }
  .intro {
    max-width: 34rem;
    margin: 0.9rem auto 0;
    line-height: 1.55;
  }
  .cta-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.75rem;
  }
  .cta-row-primary { margin-bottom: 1rem; }
  .cta-row-sources { margin-bottom: 0.75rem; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 700;
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .btn svg { flex: none; width: 1.25em; height: 1.25em; }
  .btn-lg {
    padding: 0.9rem 1.4rem;
    font-size: 1.02rem;
    min-width: 15rem;
    justify-content: center;
    box-shadow: 0 2px 8px var(--shadow);
  }
  .btn-lg:hover { transform: translateY(-2px); box-shadow: 0 6px 16px var(--shadow); }
  .btn-download {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-browser {
    background: #2b7fcc;
    color: #ffffff;
  }
  .btn-sm {
    padding: 0.35rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--fg-muted);
    border: 1px solid var(--card-border);
    background: var(--card-bg);
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--fg); }
  .browser-note, .version-note {
    text-align: center;
    font-size: 0.8rem;
    color: var(--fg-muted);
    margin: 0 0 1.4rem;
  }
  .version-note a { color: var(--fg-muted); text-underline-offset: 2px; }
  .version-note a:hover { color: var(--accent); }
  .shots {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr));
    gap: 1.25rem 1rem;
    margin-top: 3rem;
  }
  .shots figure { margin: 0; text-align: center; }
  .shots img {
    display: block;
    width: 100%;
    max-width: 220px;
    margin: 0 auto;
    border-radius: 14px;
    border: 1px solid var(--card-border);
    box-shadow: 0 2px 8px var(--shadow);
  }
  .shots figcaption {
    margin-top: 0.55rem;
    font-size: 0.82rem;
    color: var(--fg-muted);
  }
  @media (max-width: 560px) {
    main { padding: 5rem 1rem 4rem; }
    .btn-lg { min-width: 0; width: 100%; }
  }
</style>

  var currentLang;

  function t(key) {
    var dict = STRINGS[currentLang] || STRINGS.gl;
    var common = BrerenCommon.COMMON_STRINGS[currentLang] || BrerenCommon.COMMON_STRINGS.gl;
    return dict[key] || common[key] || STRINGS.gl[key] || BrerenCommon.COMMON_STRINGS.gl[key] || key;
  }

  // Same hand-off as index.html's breren.com-family tiles: a top-level
  // navigation to another origin can't carry a postMessage, so the
  // visitor's current lang/theme ride along as ?lang=&theme= and the tab
  // is reused rather than opening a new one.
  function updateBrowserLink() {
    var target = new URL(WEB_APP_URL);
    target.searchParams.set('lang', currentLang);
    target.searchParams.set('theme', BrerenCommon.effectiveTheme());
    document.getElementById('open-browser').href = target.toString();
  }

  function selectLang(code) {
    currentLang = code;
    localStorage.setItem('breren-lang', code);
    document.documentElement.lang = code;
    BrerenCommon.applyDirection(code);
    applyTexts();
  }

  function applyTexts() {
    document.title = t('pageTitle');
    var ids = {
      'page-tagline': 'tagline', 'page-intro': 'intro', 'home-link': 'backToHome', 'home-link-2': 'backToHome',
      'dl-android-label': 'dlAndroid', 'dl-windows-label': 'dlWindows', 'open-browser-label': 'openBrowser',
      'browser-note': 'browserNote', 'src-github': 'srcGithub', 'src-gitlab': 'srcGitlab',
      'src-codeberg': 'srcCodeberg', 'all-releases': 'allReleases', 'cap-events': 'capEvents',
      'cap-event': 'capEvent', 'cap-stats': 'capStats', 'cap-picker': 'capPicker'
    };
    Object.keys(ids).forEach(function (id) {
      document.getElementById(id).textContent = t(ids[id]);
    });
    updateBrowserLink();
  }

  function resolveDownloads() {
    fetch(RELEASES_API, { headers: { Accept: 'application/vnd.github+json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('GitHub API answered ' + r.status);
        return r.json();
      })
      .then(function (release) {
        Object.keys(ASSET_SUFFIX).forEach(function (id) {
          var asset = (release.assets || []).filter(function (a) {
            return a.name.slice(-ASSET_SUFFIX[id].length) === ASSET_SUFFIX[id];
          })[0];
          if (asset) document.getElementById(id).href = asset.browser_download_url;
          else console.warn('timtapper: no release asset ending in ' + ASSET_SUFFIX[id] + ' in ' + release.tag_name);
        });
        if (release.tag_name) document.getElementById('version-tag').textContent = ' · ' + release.tag_name;
      })
      .catch(function (err) {
        console.warn('timtapper: could not resolve the latest release, download buttons stay on the releases page:', err);
      });
  }

  BrerenCommon.applyIncomingPreset();
  currentLang = BrerenCommon.detectLang();
  document.documentElement.lang = currentLang;

  BrerenCommon.setupLangPicker(function () { return currentLang; }, selectLang);
  BrerenCommon.setupThemeToggle(t, updateBrowserLink);
  BrerenCommon.applyTheme(BrerenCommon.effectiveTheme(), t);
  BrerenCommon.applyDirection(currentLang);
  applyTexts();
  resolveDownloads();

  // Returning via the back button restores this page from the bfcache,
  // so re-read lang/theme in case they changed on another breren.com page.
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    currentLang = BrerenCommon.detectLang();
    BrerenCommon.applyTheme(BrerenCommon.effectiveTheme(), t);
    BrerenCommon.applyDirection(currentLang);
    applyTexts();
  });
})();

description_zh = "One Piece 集换式卡牌游戏的对局记录工具——记录每一轮,查看对阵数据,分享战绩。支持 Android、Windows 和浏览器,完全离线。"
description_ja = "ONE PIECEカードゲームの対戦記録アプリ — 毎ラウンドを記録し、対面ごとの成績を確認し、結果をシェア。Android・Windows・ブラウザ対応、完全オフライン。"
description_ko = "원피스 트레이딩 카드 게임 대전 기록 앱 — 모든 라운드를 기록하고, 상대별 전적을 보고, 결과를 공유하세요. Android, Windows, 브라우저 지원, 완전 오프라인."
description_ar = "متتبع مباريات للعبة بطاقات One Piece — سجّل كل جولة، واطّلع على نتائجك أمام كل خصم، وشارك نتائجك. على Android وWindows والمتصفح، دون اتصال بالكامل."
description_hi = "One Piece ट्रेडिंग कार्ड गेम के लिए मैच ट्रैकर — हर राउंड दर्ज करें, अपने मुकाबले देखें, नतीजे साझा करें। Android, Windows और ब्राउज़र, पूरी तरह ऑफ़लाइन।"
description_bn = "One Piece ট্রেডিং কার্ড গেমের জন্য ম্যাচ ট্র্যাকার — প্রতিটি রাউন্ড লিখে রাখুন, প্রতিপক্ষভিত্তিক ফল দেখুন, ফলাফল শেয়ার করুন। Android, Windows ও ব্রাউজার, সম্পূর্ণ অফলাইন।"
description_ur = "One Piece ٹریڈنگ کارڈ گیم کے لیے میچ ٹریکر — ہر راؤنڈ درج کریں، اپنے مقابلے دیکھیں، نتائج شیئر کریں۔ Android، Windows اور براؤزر، مکمل آف لائن۔"
description_fa = "ثبت مسابقات برای بازی کارتی One Piece — هر دور را ثبت کنید، نتایج خود را در برابر هر حریف ببینید و به اشتراک بگذارید. Android، Windows و مرورگر، کاملاً آفلاین."
description_tr = "One Piece Trading Card Game için maç takipçisi — her turu kaydet, eşleşmelerini gör, sonuçlarını paylaş. Android, Windows ve tarayıcı, tamamen çevrimdışı."
description_vi = "Theo dõi trận đấu cho One Piece Trading Card Game — ghi lại từng vòng, xem thành tích theo đối thủ, chia sẻ kết quả. Android, Windows và trình duyệt, hoàn toàn ngoại tuyến."
description_id = "Pencatat pertandingan untuk One Piece Trading Card Game — catat setiap ronde, lihat hasil melawan tiap lawan, bagikan hasilmu. Android, Windows, dan browser, sepenuhnya offline."
description_th = "แอปบันทึกการแข่งขันสำหรับ One Piece Trading Card Game — บันทึกทุกรอบ ดูผลการเจอกับคู่แข่ง และแชร์ผลการแข่งขัน ใช้ได้บน Android, Windows และเบราว์เซอร์ แบบออฟไลน์ทั้งหมด"
description_sw = "Kifuatiliaji cha mechi kwa One Piece Trading Card Game — rekodi kila raundi, ona matokeo dhidi ya kila mpinzani, shiriki matokeo yako. Android, Windows na kivinjari, nje ya mtandao kabisa."
description_te = "One Piece ట్రేడింగ్ కార్డ్ గేమ్ కోసం మ్యాచ్ ట్రాకర్ — ప్రతి రౌండ్‌ను నమోదు చేయండి, ప్రత్యర్థుల వారీగా ఫలితాలు చూడండి, ఫలితాలను పంచుకోండి. Android, Windows మరియు బ్రౌజర్, పూర్తిగా ఆఫ్‌లైన్."
description_ta = "One Piece டிரேடிங் கார்டு கேமிற்கான போட்டி டிராக்கர் — ஒவ்வொரு சுற்றையும் பதிவு செய்யுங்கள், எதிராளிகள் வாரியான முடிவுகளைப் பாருங்கள், முடிவுகளைப் பகிருங்கள். Android, Windows மற்றும் உலாவி, முழுமையாக ஆஃப்லைன்."
description_pa = "One Piece ਟ੍ਰੇਡਿੰਗ ਕਾਰਡ ਗੇਮ ਲਈ ਮੈਚ ਟ੍ਰੈਕਰ — ਹਰ ਰਾਊਂਡ ਦਰਜ ਕਰੋ, ਆਪਣੇ ਮੁਕਾਬਲੇ ਵੇਖੋ, ਨਤੀਜੇ ਸਾਂਝੇ ਕਰੋ। Android, Windows ਅਤੇ ਬ੍ਰਾਊਜ਼ਰ, ਪੂਰੀ ਤਰ੍ਹਾਂ ਔਫਲਾਈਨ।"
description_eo = "Registrilo de matĉoj por la One Piece Trading Card Game — notu ĉiun rondon, vidu viajn kontraŭulojn, kunhavigu viajn rezultojn. Android, Windows kaj retumilo, tute senrete."

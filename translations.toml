description_gl = "Capa de superposición persistente para debuxar anotacións sobre o teu escritorio en vivo — transparente ao rato, sempre visible e gardada entre sesións."
description_es = "Capa de superposición persistente para dibujar anotaciones sobre tu escritorio en vivo — transparente al ratón, siempre visible y guardada entre sesiones."
description_fr = "Superposition persistante pour dessiner des annotations sur votre bureau en direct — transparente à la souris, toujours au premier plan et sauvegardée entre les sessions."

description_ja = "ライブデスクトップ上に注釈を描く永続オーバーレイ — マウスをクリックスルーし、常に最前面に表示され、セッションをまたいで保存されます。"
description_ko = "실시간 데스크톱 위에 주석을 그리는 영구 오버레이 — 마우스 클릭이 그대로 통과하고, 항상 맨 위에 표시되며, 세션 간에 저장됩니다."
description_ar = "طبقة تراكب دائمة لرسم الملاحظات فوق سطح المكتب المباشر — شفافة للنقر، دائمًا في المقدمة، ومحفوظة عبر الجلسات."
description_hi = "आपके लाइव डेस्कटॉप पर टिप्पणियाँ बनाने के लिए स्थायी ओवरले — माउस के लिए पारदर्शी, हमेशा सबसे ऊपर, और सत्रों के बीच सहेजा जाता है।"
description_bn = "আপনার লাইভ ডেস্কটপে টীকা আঁকার জন্য স্থায়ী ওভারলে — মাউসের জন্য স্বচ্ছ, সর্বদা সবার উপরে, এবং সেশন জুড়ে সংরক্ষিত।"
description_ur = "آپ کی لائیو ڈیسک ٹاپ پر تشریحات بنانے کے لیے مستقل اوورلے — ماؤس کے لیے شفاف، ہمیشہ سب سے اوپر، اور سیشنز کے درمیان محفوظ۔"
description_fa = "روکش دائمی برای رسم یادداشت روی دسکتاپ زنده شما — نسبت به ماوس شفاف، همیشه در بالاترین لایه، و ذخیره‌شده میان نشست‌ها."
description_tr = "Canlı masaüstünüzün üzerine not çizmek için kalıcı bir katman — fareye karşı şeffaf, her zaman en üstte ve oturumlar arasında kaydedilir."
description_vi = "Lớp phủ liên tục để vẽ chú thích trên màn hình nền trực tiếp của bạn — trong suốt với chuột, luôn ở trên cùng và được lưu giữa các phiên."
description_id = "Overlay layar persisten untuk menggambar anotasi di atas desktop langsung Anda — tembus klik mouse, selalu di atas, dan tersimpan antar sesi."
description_th = "เลเยอร์ซ้อนทับถาวรสำหรับวาดคำอธิบายประกอบบนเดสก์ท็อปสดของคุณ — โปร่งใสต่อเมาส์ อยู่ด้านบนสุดเสมอ และบันทึกไว้ข้ามเซสชัน"
description_sw = "Safu ya juu ya kudumu ya kuchora maelezo juu ya desktop yako hai — huruhusu kipanya kupenya, hubaki juu kila wakati, na huhifadhiwa kati ya vipindi."
description_te = "మీ లైవ్ డెస్క్‌టాప్‌పై గమనికలు గీయడానికి శాశ్వత ఓవర్‌లే — మౌస్‌కు పారదర్శకంగా ఉంటుంది, ఎల్లప్పుడూ పైన ఉంటుంది, సెషన్‌ల మధ్య భద్రపరచబడుతుంది."
description_ta = "உங்கள் நேரடி டெஸ்க்டாப்பில் குறிப்புகளை வரைய நிரந்தர மேலடுக்கு — சுட்டியை ஊடுருவும், எப்போதும் மேலே இருக்கும், அமர்வுகளுக்கிடையே சேமிக்கப்படும்."
description_pa = "ਤੁਹਾਡੇ ਲਾਈਵ ਡੈਸਕਟਾਪ ਉੱਤੇ ਟਿੱਪਣੀਆਂ ਬਣਾਉਣ ਲਈ ਸਥਾਈ ਓਵਰਲੇ — ਮਾਊਸ ਲਈ ਪਾਰਦਰਸ਼ੀ, ਹਮੇਸ਼ਾ ਸਭ ਤੋਂ ਉੱਪਰ, ਅਤੇ ਸੈਸ਼ਨਾਂ ਵਿਚਕਾਰ ਸੰਭਾਲਿਆ ਜਾਂਦਾ ਹੈ।"
description_eo = "Daŭra ekrana kovraĵo por desegni notojn super via vivanta labortablo — travidebla al la muso, ĉiam supre, kaj konservata inter seancoj."


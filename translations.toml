description_gl = "Selector de números aleatorios multiplataforma — extrae N números dun conxunto de 1…M, con ou sen repetición."
description_es = "Selector de números aleatorios multiplataforma — extrae N números de un conjunto de 1…M, con o sin reemplazo."
description_fr = "Sélecteur de nombres aléatoires multiplateforme — tire N nombres parmi 1…M, avec ou sans remise."
description_pt = "Seletor de números aleatórios multiplataforma — sorteia N números de um conjunto de 1…M, com ou sem reposição."
description_de = "Plattformübergreifender Zufallszahlengenerator — zieht N Zahlen aus einem Pool von 1…M, mit oder ohne Zurücklegen."
description_it = "Selettore di numeri casuali multipiattaforma — estrae N numeri da un insieme di 1…M, con o senza reinserimento."
description_ru = "Кроссплатформенный генератор случайных чисел — выбирает N чисел из диапазона 1…M, с повторением или без."
description_zh = "跨平台随机数选择器——从1…M的数字池中抽取N个数字,可选是否放回。"
description_ja = "クロスプラットフォーム対応の乱数セレクター — 1…Mの範囲からN個の数字を抽出(復元・非復元選択可)。"
description_ko = "크로스플랫폼 난수 선택기 — 1…M 범위에서 N개의 숫자를 추출(복원 또는 비복원 추출 선택 가능)."
description_ar = "أداة اختيار أرقام عشوائية متعددة المنصات — تسحب N رقمًا من مجموعة 1…M، مع الإرجاع أو بدونه."
description_hi = "क्रॉस-प्लेटफ़ॉर्म रैंडम नंबर सेलेक्टर — 1…M की सीमा से N संख्याएँ चुनता है, प्रतिस्थापन के साथ या बिना।"
description_bn = "ক্রস-প্ল্যাটফর্ম র‍্যান্ডম নম্বর সিলেক্টর — 1…M পরিসর থেকে N সংখ্যা নির্বাচন করে, প্রতিস্থাপনসহ বা ছাড়া।"
description_ur = "کراس پلیٹ فارم رینڈم نمبر سلیکٹر — 1…M کی حد سے N نمبر منتخب کرتا ہے، تبدیلی کے ساتھ یا بغیر۔"
description_fa = "انتخابگر اعداد تصادفی چندسکویی — N عدد را از بازه 1…M انتخاب می‌کند، با یا بدون جایگذاری."
description_tr = "Platformlar arası rastgele sayı seçici — 1…M aralığından N sayı çeker, iadeli veya iadesiz."
description_vi = "Trình chọn số ngẫu nhiên đa nền tảng — rút N số từ khoảng 1…M, có hoặc không hoàn lại."
description_id = "Pemilih angka acak lintas platform — menarik N angka dari kumpulan 1…M, dengan atau tanpa pengembalian."
description_th = "ตัวเลือกเลขสุ่มข้ามแพลตฟอร์ม — สุ่มเลข N ตัวจากช่วง 1…M แบบใส่คืนหรือไม่ใส่คืนก็ได้"
description_sw = "Kichagua namba nasibu cha majukwaa mengi — huchota namba N kutoka kwenye kundi la 1…M, kwa kurudisha au bila kurudisha."
description_te = "క్రాస్-ప్లాట్‌ఫారమ్ యాదృచ్ఛిక సంఖ్యల ఎంపిక సాధనం — 1…M పరిధి నుండి N సంఖ్యలను ఎంపిక చేస్తుంది, పునఃస్థాపనతో లేదా లేకుండా."
description_ta = "பல தளங்களில் இயங்கும் சீரற்ற எண் தேர்வி — 1…M வரம்பிலிருந்து N எண்களைத் தேர்ந்தெடுக்கிறது, மாற்றீட்டுடன் அல்லது இல்லாமல்."
description_pa = "ਕਰਾਸ-ਪਲੇਟਫਾਰਮ ਰੈਂਡਮ ਨੰਬਰ ਚੋਣਕਾਰ — 1…M ਦੇ ਦਾਇਰੇ ਤੋਂ N ਨੰਬਰ ਚੁਣਦਾ ਹੈ, ਬਦਲੀ ਨਾਲ ਜਾਂ ਬਿਨਾਂ।"
description_eo = "Transplatforma hazardnombra elektilo — tiras N nombrojn el intervalo 1…M, kun aŭ sen anstataŭigo."


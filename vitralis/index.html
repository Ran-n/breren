<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitralis</title>
<link rel="icon" type="image/png" href="../icons/vitralis.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="vitralis-frame" src="https://ran-n.github.io/vitralis/" title="Vitralis" allowfullscreen></iframe>
<script>
  document.getElementById('vitralis-frame').addEventListener('load', function () {
    this.contentWindow.postMessage({
      type: 'vitralis-preset',
      lang: localStorage.getItem('breren-lang'),
      theme: localStorage.getItem('breren-theme')
    }, 'https://ran-n.github.io');
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitralis</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="vitralis-frame" title="Vitralis" allowfullscreen></iframe>
<script>
  var params = new URLSearchParams();
  var lang = localStorage.getItem('breren-lang');
  var theme = localStorage.getItem('breren-theme');
  if (lang) params.set('lang', lang);
  if (theme) params.set('theme', theme);
  var qs = params.toString();
  document.getElementById('vitralis-frame').src =
    'https://ran-n.github.io/vitralis/' + (qs ? '?' + qs : '');
</script>
</body>
</html>
